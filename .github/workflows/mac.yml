name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-macos-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS app
        run: |
          pyinstaller \
            --noconfirm \
            --windowed \
            --name "Canine Impaction Analyzer" \
            main.py

      - name: Create DMG staging folder
        run: |
          mkdir dmg_stage
          cp -R "dist/Canine Impaction Analyzer.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Canine Impaction Analyzer" \
            -srcfolder dmg_stage \
            -ov \
            -format UDZO \
            CanineImpactionAnalyzer_v1.1.2_macOS.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CanineImpactionAnalyzer-v1.1.2-macOS-DMG
          path: CanineImpactionAnalyzer_v1.1.2_macOS.dmg
          if-no-files-found: error
