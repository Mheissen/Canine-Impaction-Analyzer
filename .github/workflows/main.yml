name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Pillow for icon conversion
        run: pip install pillow

      - name: Convert PNG icon to ICO
        shell: python
        run: |
          from PIL import Image
          img = Image.open("PDC_Analyzer_Icon.png").convert("RGBA")
          img.save(
              "PDC_Analyzer_Icon.ico",
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]
          )

      - name: Build Windows application
        shell: cmd
        run: build_installer_windows.bat

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PDC-Analyzer-Setup-v1.2.0
          path: installer_output/PDC-Analyzer-Setup-v1.1.2.exe
          if-no-files-found: error
